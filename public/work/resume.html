 <script>
    async function fetchGoogleSheetData() {
      console.log("hello")
      try {
        const apiKey = "AIzaSyA0S8JN0-HPKVIF6adOJ4ngfd50C2OJKBY";
        const spreadsheetId = "1ERuKbxjX9-qqrDjOpDATlkkpYgUoQa4xAChMsPMJDwY"
        const sheetName = "Sheet1"; // or "Form responses 1", or default name in other language
        const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${sheetName}?key=${apiKey}`);
        const data = await response.json();
        const rows = data.values.slice(1);
        console.log(rows);

        makeDisplay("experience", rows);

      } catch (error) {
        console.error("Error fetching Google Sheets data:", error);
      }
 };

 function makeDisplay(container, rowData) {
    HTML = ``
    for (let i=0; i < rowData.length; i++) {
        HTML+= `<div class="experience">`;
        HTML+= `<div class="info">`;
        HTML += `<div class="heading">`
        HTML +=  `<h2>${rowData[i][0]}</h2>`;
        HTML += `<h3>${rowData[i][2]}</h3>`;
        HTML += `</div>`
        if (rowData[i][1] != "" ) {
            HTML += `<a href=${rowData[i][1]}}>Project Link</a>`
        }
        HTML+= `<p>${rowData[i][3]}</p>`;
        HTML += `</div>`;
        HTML += `<div class="dates">`;
        HTML += `${rowData[i][4]}`;
        HTML += `</div>`;
        HTML += `</div>`;
    }

    document.getElementById("experience-container").innerHTML = HTML;
 };
</script>
